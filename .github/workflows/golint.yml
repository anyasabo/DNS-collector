name: Go Linter

on:
  push:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
    branches:
      - main

permissions:
  contents: read # for actions/checkout to fetch code
  pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests

env:
  GO_VERSION: "1.27"
  GOLANGCI_LINT_VERSION: "v2.14.0"

jobs:
  linter:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: "${{ env.GO_VERSION }}"
        # Use a lint-only cache key. With the default key (go.sum only), this job
        # shares a cache with every other Linux setup-go job, and the first job to
        # finish saves it. That is often a light job with an almost empty build cache.
        cache-dependency-path: |
          go.sum
          .github/workflows/golint.yml

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: "${{ env.GOLANGCI_LINT_VERSION }}"
        args: --timeout 3m --verbose
 